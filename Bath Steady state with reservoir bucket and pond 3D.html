<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reservoir, bucket and pond</title>
<style>
:root{--bg:#fff;--fg:#111;--line:#0d4a68;--dark:#15607f;--water:#2b78a3;--wl:#8cc4de;--lt:#2b78a3;--lt2:#2b78a3;--muted:#555;--card:#f3f4f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--fg:#eee;--line:#7fc4e6;--dark:#2f8fbf;--water:#2b78a3;--wl:#8cc4de;--lt:#2b78a3;--lt2:#2b78a3;--muted:#aaa;--card:#22242b}}
:root[data-theme="dark"]{--bg:#15161a;--fg:#eee;--line:#7fc4e6;--dark:#2f8fbf;--water:#2b78a3;--wl:#8cc4de;--lt:#2b78a3;--lt2:#2b78a3;--muted:#aaa;--card:#22242b}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1100px;margin:0 auto;padding:12px}
svg{width:100%;height:auto;display:block}
.ln{fill:none;stroke:#0b3a55;stroke-width:3}
.lbl{font-size:60px;font-weight:700;fill:#ffd84a;stroke:#0b2a40;stroke-width:10px;paint-order:stroke;stroke-linejoin:round}
@keyframes drift{from{transform:translateX(-16px);opacity:.15}50%{opacity:.6}to{transform:translateX(16px);opacity:.15}}
.sh{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;animation:drift 6s ease-in-out infinite alternate}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
@media(max-width:560px){.ctl{grid-template-columns:1fr}}
.ctl label{display:block;background:var(--card);border-radius:10px;padding:10px 12px;font-size:15px}
.ctl input{width:100%;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted);font-size:14px;gap:8px;flex-wrap:wrap}
button{font:inherit;padding:6px 14px;border-radius:8px;border:1px solid var(--muted);background:var(--card);color:var(--fg);cursor:pointer}
</style>
</head>

  <ellipse id="wtop" cx="402" rx="98" ry="24" fill="var(--wl)" stroke="var(--line)" stroke-width="1.5"/>
  <path d="M314,300 V425" stroke="#fff" stroke-opacity=".45" stroke-width="5" stroke-linecap="round" fill="none"/>
  <text class="lbl" x="540" y="300">Bucket</text>
  <text class="lbl" x="540" y="364">(Intermediate)</text>
  <text class="lbl" x="790" y="640">Pond (Products)</text>
  <!-- streams then holes -->
  <!-- holes first, so the right half of each sits behind its stream -->
  <ellipse id="h1" cx="302" cy="165" rx="27" ry="50" fill="var(--water)" stroke="var(--line)" stroke-width="2"/>
  <path id="h2" d="M427,473 A35,50 0 0 1 497,457" fill="var(--water)" stroke="var(--line)" stroke-width="2"/>
  <g id="rb1"></g><g id="rb2"></g>
  <path id="j1" fill="none" stroke="var(--water)"/>
  <path id="j2" fill="none" stroke="var(--water)"/>
  <g id="pt1"></g><g id="pt2"></g><g id="rp1"></g><g id="rp2"></g>
  <path class="ln" d="M302,287 A100,25 0 0 0 502,287"/>
  </g>
</svg>
<div class="ctl">
  <label>Reservoir hole size: <b id="v1">0%</b>
    <input id="s1" type="range" min="0" max="1" step="0.01" value="0"></label>
  <label>Bucket hole size: <b id="v2">50%</b>
    <input id="s2" type="range" min="0" max="1" step="0.01" value="0.5"></label>
</div>
<div class="row">
  <span>Bucket level: <b id="lv">0%</b> &nbsp;|&nbsp; inflow <b id="fi">0</b> &nbsp; outflow <b id="fo">0</b></span>
  <span><button id="reset">Empty bucket</button></span>
</div>
</main>
<script>
(function(){
  var IN_MAX=0.28, OUT_MAX=0.56, FLOW_MAX=0.4, K=16.9;
  var h=0, last=null, T=0;
  var $=function(id){return document.getElementById(id)};
  var s1=$('s1'), s2=$('s2');
  var NS='http://www.w3.org/2000/svg', NP=8, ph=[[],[]], offs=[], pc=[[],[]], rc=[[],[]];
  function el(tag,parent,attrs){var e=document.createElementNS(NS,tag);for(var a in attrs)e.setAttribute(a,attrs[a]);parent.appendChild(e);return e;}
  function shim(gid,pts){pts.forEach(function(q,i){var g=el('g',$(gid),{transform:'translate('+q[0]+','+q[1]+')'});var u=el('use',g,{href:'#wv','class':'sh'});u.style.animationDuration=(4+(i*1.7)%4)+'s';u.style.animationDelay=(-i*1.3)+'s';});}
  shim('shr',[[120,125],[220,140],[150,165],[300,150],[260,190],[180,205],[330,118]]);
  shim('shb',[[320,380],[390,400],[330,425],[420,440],[380,360]]);
  for(var k=0;k<2;k++){
    for(var i=0;i<NP;i++){ph[k][i]=i/NP;if(k===0)offs[i]=((i*5)%7-3)/3;pc[k][i]=el('circle',$('pt'+(k+1)),{fill:'#fff',opacity:0,r:3});}
    for(var j=0;j<3;j++){var ra={fill:'none',stroke:'#fff','stroke-width':1.5,opacity:0};rc[k][j]={b:el('path',$('rb'+(k+1)),ra),f:el('path',$('rp'+(k+1)),ra)};}
  }
  function fx(k,x0,y0,yEnd,f,s,dt){
    var on=f>=0.003&&yEnd>y0+2, w=Math.max(Math.min(86*f,100),1), i, j, c, y, q;
    for(i=0;i<NP;i++){
      c=pc[k][i];
      if(!on){c.setAttribute('opacity',0);continue;}
      ph[k][i]=(ph[k][i]+dt*(0.6+1.4*f))%1;
      y=y0+(yEnd-y0)*Math.pow(ph[k][i],1.7);
      c.setAttribute('cx',x0+K*f*Math.sqrt(y-y0)+offs[i]*w*0.3);
      c.setAttribute('cy',y);
      c.setAttribute('r',Math.max(w*0.15,1.2));
      c.setAttribute('opacity',0.7*Math.min(1,ph[k][i]*6,(1-ph[k][i])*6));
    }
    for(j=0;j<3;j++){
      c=rc[k][j]; q=(T*0.7+j/3)%1;
      var rx=(0.2+q)*(w*0.9+12);
      var cx=x0+K*f*Math.sqrt(Math.max(yEnd-y0,0)), ry=rx*0.28, op=on?0.8*(1-q)*Math.min(1,f*4):0;
      c.b.setAttribute('d','M'+(cx-rx)+','+yEnd+' A'+rx+','+ry+' 0 0 1 '+(cx+rx)+','+yEnd);
      c.f.setAttribute('d','M'+(cx-rx)+','+yEnd+' A'+rx+','+ry+' 0 0 0 '+(cx+rx)+','+yEnd);
      c.b.setAttribute('opacity',op);c.f.setAttribute('opacity',op);
    }
  }
  function stream(x0,y0,yEnd,f){
    if(f<0.003||yEnd<=y0+2) return '';
    var N=30,p=[],i,y;
    for(i=0;i<=N;i++){y=y0+(yEnd-y0)*i/N;p.push((x0+K*f*Math.sqrt(y-y0)).toFixed(1)+' '+y.toFixed(1));}
    return 'M'+p.join(' L');
  }
  function hole(id,jid,x,y,rx,ry,s,d,f){
    var sc=Math.max(s,0.06);
    $(id).setAttribute('rx',rx*sc);$(id).setAttribute('ry',ry*sc);
    $(jid).setAttribute('d',d);
    var sw=Math.max(Math.min(86*f,100),1);$(jid).setAttribute('stroke-width',sw);
  }
  function draw(inflow,outflow,dt){
    var cy=449-h*150; T+=dt;
    var wb=$('wbody');
    if(h>0.004){
      var D='M304,'+cy+' V449 A98,24 0 0 0 500,449 V'+cy+' A98,24 0 0 1 304,'+cy+' Z';wb.setAttribute('d',D);$('wshade').setAttribute('d',D);$('wclip').setAttribute('d',D);
      $('wtop').setAttribute('cy',cy);$('wtop').style.display='';
    } else {wb.setAttribute('d','');$('wshade').setAttribute('d','');$('wclip').setAttribute('d','');$('wtop').style.display='none';}
    hole('h1','j1',302,165,27,50,+s1.value,stream(302,165,cy,inflow/FLOW_MAX),inflow/FLOW_MAX);
    var sc2=Math.max(+s2.value,0.06), a2=35*sc2, yb=function(x){return 449+25*Math.sqrt(1-Math.pow((x-402)/100,2));}, ya=yb(462-a2), yc=yb(462+a2), w2=Math.max(Math.min(86*outflow/FLOW_MAX,100),1), y2=yb(480)-w2/2;
    $('h2').setAttribute('d','M'+(462-a2)+','+ya+' A'+a2+','+(90*sc2)+' 0 0 1 '+(462+a2)+','+yc);
    hole('h2','j2',462,400,35,50,+s2.value,stream(462,y2,630,outflow/FLOW_MAX),outflow/FLOW_MAX);
    fx(0,302,165,cy,inflow/FLOW_MAX,+s1.value,dt);fx(1,462,y2,630,outflow/FLOW_MAX,+s2.value,dt);
    $('lv').textContent=Math.round(h*100)+'%';
    $('fi').textContent=(inflow/FLOW_MAX*100).toFixed(0)+'%';
    $('fo').textContent=(outflow/FLOW_MAX*100).toFixed(0)+'%';
  }
  function frame(t){
    if(last===null)last=t;
    var dt=Math.min((t-last)/1000,0.1); last=t;
    var a=+s1.value,b=+s2.value;
    var inflow=IN_MAX*a;
    var outflow=OUT_MAX*b*h;
    h+=(inflow-outflow)*dt;
    h=Math.max(0,Math.min(1,h));
    outflow=OUT_MAX*b*h;
    if(h>=1&&inflow>outflow) inflow=outflow;
    draw(inflow,outflow,dt);
    requestAnimationFrame(frame);
  }
  s1.oninput=function(){$('v1').textContent=Math.round(s1.value*100)+'%'};
  s2.oninput=function(){$('v2').textContent=Math.round(s2.value*100)+'%'};
  $('reset').onclick=function(){h=0};
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
